# The production profile, which the Docker image turns on (SPRING_PROFILES_ACTIVE=production): templates are
# cached, errors never show details, no banner, and logs go to stdout only.
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.main.banner-mode=off
logging.file.name=
