# The app's settings. Each one maps a cross-platform environment variable name, so environment variables,
# settings.env and .env (read as properties files: KEY=value lines) and the contract runner use the same words as
# the other platforms. settings.env (committed) holds every setting but the private keys, .env (git-ignored) only
# those. Real environment variables win over .env, and .env over settings.env (the later import wins).
# config/SurveyJsProperties.java reads the surveyjs.* keys.
spring.application.name=surveyjs-java-spring-boot
spring.config.import=optional:file:settings.env[.properties],optional:file:.env[.properties]

# Where the app listens: 127.0.0.1 by default, so Windows Defender Firewall doesn't ask on the first run.
# StartupGuard refuses a port something already answers on.
server.port=${APP_PORT:8000}
server.address=${APP_HOST:127.0.0.1}

# Virtual threads: a request waiting on the SurveyJS service or the AI provider parks a virtual thread
spring.threads.virtual.enabled=true

# Behind a TLS proxy: Tomcat's RemoteIpValve trusts X-Forwarded-For and X-Forwarded-Proto from its internal
# proxies (loopback and private ranges). Narrow server.tomcat.remoteip.internal-proxies in your own production.
server.forward-headers-strategy=native

# Uploads: a 5 MB scan travels to the service as base64 in JSON; the handlers keep their own 5 MB rules
spring.servlet.multipart.max-file-size=24MB
spring.servlet.multipart.max-request-size=24MB

# schema.sql creates the tables (CREATE TABLE IF NOT EXISTS) at every start, also for the file database
spring.sql.init.mode=always

# Only /shared/{client,definitions,samples,ui}/** and /css/** are served (web/WebConfig.java); nothing else
# under src/main/resources/static or the repository is reachable
spring.web.resources.add-mappings=false

# A 404 is an answer ({ error } under /api, web/ApiErrors.java), not a warning: no "No mapping for GET …" per scanner hit
logging.level.org.springframework.web.servlet.PageNotFound=error

# Graceful shutdown: requests in flight finish before the JVM stops (Docker's SIGTERM)
server.shutdown=graceful

# The SurveyJS settings (README: Configuration). Blank means unset.
surveyjs.service-url=${SURVEYJS_SERVICE_URL:http://localhost:3010}
surveyjs.validate-responses=${VALIDATE_RESPONSES:false}
surveyjs.lint-definitions=${LINT_DEFINITIONS:false}
surveyjs.demo-mode=${DEMO_MODE:false}
surveyjs.relay-url=${RELAY_URL:}
surveyjs.edit-relay-url=${EDIT_RELAY_URL:}
surveyjs.license-key=${SURVEYJS_LICENSE_KEY:}
surveyjs.ai-base-url=${AI_BASE_URL:https://api.openai.com/v1}
surveyjs.ai-api-key=${AI_API_KEY:}
surveyjs.ai-model=${AI_MODEL:gpt-4o-mini}
surveyjs.ai-provider=${SURVEYJS_AI_PROVIDER:}
surveyjs.ai-extraction-model=${SURVEYJS_AI_MODEL:}
surveyjs.ollama-base-url=${SURVEYJS_OLLAMA_BASE_URL:}
surveyjs.openai-api-key=${OPENAI_API_KEY:}
surveyjs.anthropic-api-key=${ANTHROPIC_API_KEY:}
surveyjs.build=${SURVEYJS_BUILD:}
surveyjs.data-dir=${DATA_DIR:storage}
surveyjs.docs=${SURVEYJS_DOCS:https://surveyjs.io/documentation/backend-integration-spring-boot}
surveyjs.github=${SURVEYJS_GITHUB:https://github.com/surveyjs/surveyjs-java-spring-boot}
surveyjs.app-port=${server.port}
